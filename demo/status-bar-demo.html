<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Touch Codex++ Dashboard Demo</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05080b; color: #d9e2e8; }
    main { display: grid; gap: 18px; justify-items: center; padding: 24px; }
    .screen { width: min(466px, 88vw); aspect-ratio: 1; }
    svg { width: 100%; height: 100%; display: block; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button { border: 1px solid #334854; border-radius: 999px; background: #16242c; color: #c9d6dd; padding: 8px 14px; cursor: pointer; }
    button[aria-pressed="true"] { border-color: #35d8e5; color: #effcff; background: #1c3d47; }
    .note { margin: 0; color: #7f929d; font-size: 13px; }
    .screen { touch-action: none; user-select: none; }
    /* SVG groups need explicit visibility as well as display. Only one page
       group is ever painted; the status capsule stays outside this layer. */
    .page { display: none !important; visibility: hidden !important; opacity: 0 !important; }
    .page.is-active { display: inline !important; visibility: visible !important; opacity: 1 !important; }
    body.export { width: 466px; min-height: 466px; overflow: hidden; place-items: start; }
    body.export main { padding: 0; gap: 0; }
    body.export .screen { width: 466px; }
    body.export nav, body.export .note { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="screen" aria-label="466 by 466 circular display preview">
      <svg viewBox="0 0 466 466" role="img" aria-labelledby="title desc">
        <title id="title">Minimal circular status bar</title>

            <stop offset=".42" stop-color="#34d9e7"/>
            <stop offset=".78" stop-color="#f5a641"/>
            <stop offset="1" stop-color="#f05b69"/>
          </linearGradient>
        </defs>
        <circle cx="233" cy="233" r="233" fill="#05080b"/>
        <g clip-path="url(#round-screen)">
          <rect width="466" height="466" fill="#111820"/>
          <g id="page-layer" clip-path="url(#round-screen)">

          <g id="page-home" class="page" style="display: none; visibility: hidden">

          <text x="233" y="126" fill="#d4dee7" font-size="16" text-anchor="middle" letter-spacing="1">ACTIVE CODEX SESSION</text>

          <line x1="332" y1="139" x2="332" y2="382" stroke="#41515f"/>

          <text x="84" y="181" fill="#b9c5d0" font-size="14" text-anchor="middle">ACTIONS</text>
          <rect x="38" y="205" width="92" height="145" rx="14" fill="#22364a"/>

            <path d="M-9 -7h6m3 0h9M-9 2h6m3 0h9M-9 11h6m3 0h9"/>
          </g>

            </g>
            <g fill="#e8eef5" font-size="16">
              <text x="70" y="148">A1</text><text x="125" y="148" fill="#3489f4">RUN</text><text x="218" y="148" fill="#b9c5d0">Build dashboard</text>
              <text x="70" y="186">A2</text><text x="125" y="186" fill="#28c96d">DONE</text><text x="218" y="186" fill="#b9c5d0">Run tests</text>

              <text x="70" y="300">A5</text><text x="125" y="300" fill="#3489f4">RUN</text><text x="218" y="300" fill="#b9c5d0">Inspect API</text>

          <g id="page-agents" class="page" style="display: none; visibility: hidden">
            <g stroke="#0b151c" stroke-width="3">
              <path d="M233 15 A218 218 0 0 1 422 124 L299 195 A76 76 0 0 0 233 157 Z" fill="#e53935"/>
              <path d="M422 124 A218 218 0 0 1 422 342 L299 271 A76 76 0 0 0 299 195 Z" fill="#f28c28"/>

              <path d="M44 342 A218 218 0 0 1 44 124 L167 195 A76 76 0 0 0 167 271 Z" fill="#16c6c1"/>
              <path d="M44 124 A218 218 0 0 1 233 15 L233 157 A76 76 0 0 0 167 195 Z" fill="#3478db"/>
            </g>
            <g fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">
              <text x="298" y="91">A1</text><text x="298" y="113" font-size="14">RUN</text>
              <text x="384" y="244">A2</text><text x="384" y="266" font-size="14">DONE</text>
              <text x="350" y="375" fill="#10151b">A3</text><text x="350" y="397" fill="#10151b" font-size="14">INPUT</text>
              <text x="116" y="375" fill="#10151b">A4</text><text x="116" y="397" fill="#10151b" font-size="14">IDLE</text>
              <text x="82" y="244">A5</text><text x="82" y="266" font-size="14">RUN</text>
              <text x="168" y="91">A6</text><text x="168" y="113" font-size="14">ERROR</text>
            </g>
            <circle cx="233" cy="233" r="76" fill="#070b10" stroke="#26323d" stroke-width="3"/>
            <text x="233" y="245" fill="#63dcc5" font-size="26" font-weight="bold" text-anchor="middle">ACTIVE 6</text>
          </g>

          <g id="page-agent-detail" class="page" style="display: none; visibility: hidden">

            <text id="detail-status" x="233" y="132" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">RUN</text>
            <text id="detail-meta" x="233" y="166" fill="#9fb1be" font-size="13" text-anchor="middle">gpt-5  |  /workspace/codex-touch</text>
            <line x1="82" y1="191" x2="384" y2="191" stroke="#354752"/>
            <text x="233" y="216" fill="#63dcc5" font-size="14" font-weight="bold" text-anchor="middle">LATEST OUTPUT</text>
            <text id="detail-output" x="233" y="252" fill="#e6eef3" font-size="16" text-anchor="middle">
              <tspan x="233" dy="0">Compiling the current display</tspan>
              <tspan x="233" dy="24">frame and checking the relay...</tspan>
            </text>
            <text x="233" y="406" fill="#91a2b2" font-size="13" text-anchor="middle">LIVE AGENT OUTPUT</text>
          </g>
          </g>

          <!-- Minimal status overlay: Wi-Fi, centered battery percent, battery. -->
          <path d="M113 0H353V15C353 39 335 58 311 58H155C131 58 113 39 113 15Z" fill="#091016" stroke="#3a4b57" stroke-width="2"/>
          <g transform="translate(165 28)" fill="none" stroke="#b8c7d4" stroke-width="2.2" stroke-linecap="round">
            <path d="M-10 7Q0 -3 10 7M-6 11Q0 5 6 11"/>
            <circle cx="0" cy="15" r="1.8" fill="#b8c7d4" stroke="none"/>
          </g>
          <text x="233" y="38" fill="#b8c7d4" font-size="15" text-anchor="middle">82%</text>
          <g transform="translate(274 32)" fill="none" stroke="#b8c7d4" stroke-width="2.2" stroke-linejoin="round">
            <rect x="-13" y="-7" width="27" height="14" rx="3"/><path d="M15 -3h4v6h-4Z" fill="#b8c7d4" stroke="none"/><rect x="-10" y="-4" width="17" height="8" rx="2" fill="#43d67f" stroke="none"/>
          </g>
        </g>
      </svg>
    </div>
    <nav aria-label="Demo views">
      <button data-view="home" aria-pressed="true">Home</button>
      <button data-view="tasks" aria-pressed="false">Tasks</button>
      <button data-view="approval" aria-pressed="false">Approval</button>
      <button data-view="agents" aria-pressed="false">Agents</button>
    </nav>
    <p class="note">466 x 466 preview. The status capsule overlays the page and does not reserve layout space.</p>
  </main>
</body>
<script>
  if (new URLSearchParams(window.location.search).get('export') === '1') {
    document.body.classList.add('export');
  }
  const screen = document.querySelector('.screen');
  const buttons = [...document.querySelectorAll('[data-view]')];
  const pages = Object.fromEntries(['home', 'tasks', 'approval', 'agents', 'agent-detail'].map(name => [name, document.getElementById('page-' + name)]));
  const requestedView = new URLSearchParams(window.location.search).get('view');
  let active = pages[requestedView] ? requestedView : 'home';
  let selectedAgent = 0;
  const agentData = [
    { title: 'Build dashboard', status: 'RUN', color: '#e53935', text: 'Compiling the current display frame and checking the relay response.', meta: 'gpt-5  |  /workspace/codex-touch' },
    { title: 'Run tests', status: 'DONE', color: '#f28c28', text: 'All relay and firmware checks passed. The latest build is ready.', meta: 'pytest  |  /workspace/codex-touch' },
    { title: 'Review changes', status: 'INPUT', color: '#f4d03f', text: 'The agent is waiting for a decision from the operator.', meta: 'gpt-5  |  /workspace/codex-touch' },
    { title: 'Update docs', status: 'IDLE', color: '#2ecc71', text: 'Documentation is synchronized with the current Codex++ workflow.', meta: 'docs  |  /workspace/codex-touch' },
    { title: 'Inspect API', status: 'RUN', color: '#16c6c1', text: 'GET /api/v1/state returned the latest live snapshot.', meta: 'python  |  /workspace/codex-touch' },
    { title: 'Prepare release', status: 'ERROR', color: '#3478db', text: 'Release packaging needs one more correction before publishing.', meta: 'release  |  /workspace/codex-touch' },
    { title: 'Archive task', status: 'WAIT', color: '#8e44ad', text: 'Waiting for the next Codex++ event.', meta: 'codex++  |  /workspace/codex-touch' }
  ];
  let start = null;
  function hidePage(page) {
    if (typeof page.getAnimations === 'function') {
      page.getAnimations().forEach(animation => animation.cancel());
    }
    page.classList.remove('is-active');
    page.style.setProperty('display', 'none', 'important');
    page.style.setProperty('visibility', 'hidden', 'important');
    page.style.setProperty('opacity', '0', 'important');
    page.setAttribute('display', 'none');
    page.setAttribute('visibility', 'hidden');
    page.setAttribute('opacity', '0');
    page.style.transform = '';
  }

  function showPage(page) {
    page.classList.add('is-active');
    page.style.setProperty('display', 'inline', 'important');
    page.style.setProperty('visibility', 'visible', 'important');
    page.style.setProperty('opacity', '1', 'important');
    page.setAttribute('display', 'inline');
    page.setAttribute('visibility', 'visible');
    page.setAttribute('opacity', '1');
  }

  Object.values(pages).forEach(hidePage);
  showPage(pages[active]);
  buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === active)));

  function showView(next, direction = 1) {
    if (!pages[next] || next === active) return;
    const incoming = pages[next];
    Object.values(pages).forEach(hidePage);
    showPage(incoming);
    if (!new URLSearchParams(window.location.search).has('export')) {
      const vertical = Math.abs(direction) === 2;
      const sign = direction < 0 ? -1 : 1;
      const startTransform = vertical ? 'translateY(' + (sign * 34) + 'px)' : 'translateX(' + (sign * 34) + 'px)';
      incoming.animate([{ opacity: 0, transform: startTransform }, { opacity: 1, transform: 'translate(0, 0)' }], {
        duration: 220,
        easing: 'cubic-bezier(.2,.8,.2,1)',
        fill: 'both'
      });
    }
    buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === next)));
    active = next;
  }

  function wrapSvgText(text, maxChars = 30, maxLines = 6) {
    const words = String(text || '').split(/\s+/).filter(Boolean);
    const lines = [];
    let line = '';
    words.forEach(word => {
      if (line && (line + ' ' + word).length > maxChars) { lines.push(line); line = ''; }
      line += (line ? ' ' : '') + word;
    });
    if (line) lines.push(line);
    return lines.slice(0, maxLines);
  }

  function updateAgentDetail(index) {
    const agent = agentData[index] || agentData[0];
    const title = document.getElementById('detail-title');
    while (title.firstChild) title.removeChild(title.firstChild);
    wrapSvgText(agent.title, 24, 2).forEach((line, lineIndex) => {
      const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      tspan.setAttribute('x', '233');
      tspan.setAttribute('dy', lineIndex === 0 ? '0' : '23');
      tspan.textContent = line;
      title.appendChild(tspan);
    });
    document.getElementById('detail-status').textContent = agent.status;
    document.getElementById('detail-status-fill').setAttribute('fill', agent.color);
    document.getElementById('detail-meta').textContent = agent.meta;
    const output = document.getElementById('detail-output');
    while (output.firstChild) output.removeChild(output.firstChild);
    wrapSvgText(agent.text).forEach((line, lineIndex) => {
      const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      tspan.setAttribute('x', '233');
      tspan.setAttribute('dy', lineIndex === 0 ? '0' : '24');
      tspan.textContent = line;
      output.appendChild(tspan);
    });
  }

  function agentIndexAt(event) {
    const point = new DOMPoint(event.clientX, event.clientY);
    const svg = screen.querySelector('svg');
    const local = point.matrixTransform(svg.getScreenCTM().inverse());
    const dx = local.x - 233;
    const dy = local.y - 233;
    const distance = Math.hypot(dx, dy);
    const count = agentData.length - 1;
    if (distance < 76 || distance > 218) return -1;
    const degrees = (Math.atan2(dy, dx) * 180 / Math.PI + 90 + 360) % 360;
    return Math.floor(degrees / (360 / count));
  }

  buttons.forEach(button => button.addEventListener('click', () => showView(button.dataset.view)));
  updateAgentDetail(selectedAgent);
  let detailTick = 0;
  window.setInterval(() => {
    if (active !== 'agent-detail') return;
    detailTick += 1;
    const agent = agentData[selectedAgent] || agentData[0];
    const suffixes = ['Waiting for the next Codex++ event.', 'Reading the newest rollout output.', 'Relay snapshot is live.'];
    const output = agent.text + ' ' + suffixes[detailTick % suffixes.length];
    const target = document.getElementById('detail-output');
    while (target.firstChild) target.removeChild(target.firstChild);
    wrapSvgText(output).forEach((line, lineIndex) => {
      const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      tspan.setAttribute('x', '233');
      tspan.setAttribute('dy', lineIndex === 0 ? '0' : '24');
      tspan.textContent = line;
      target.appendChild(tspan);
    });
  }, 2000);
  screen.addEventListener('pointerdown', event => { start = { x: event.clientX, y: event.clientY }; });
  screen.addEventListener('pointerup', event => {
    if (!start) return;
    const dx = event.clientX - start.x;
    const dy = event.clientY - start.y;
    start = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) {
      if (active === 'agents') {
        const index = agentIndexAt(event);
        if (index >= 0) {
          selectedAgent = index;
          updateAgentDetail(selectedAgent);
          showView('agent-detail', -1);
        }
      }
      return;
    }
    if (Math.abs(dx) >= Math.abs(dy)) {
      if (active === 'home' && dx > 0) showView('tasks', -1);
      else if (active === 'home' && dx < 0) showView('approval', 1);
      else if (active === 'tasks' && dx < 0) showView('home', 1);
      else if (active === 'approval' && dx > 0) showView('home', -1);
      else if (active === 'agent-detail' && dx < 0) showView('agents', 1);
    } else if (active === 'home' && dy < 0) showView('agents', 2);
    else if (active === 'agents' && dy > 0) showView('home', -2);
  });
</script>
</html>
